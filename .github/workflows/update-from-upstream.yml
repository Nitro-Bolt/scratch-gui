name: Update from Upstream

on:
  repository_dispatch:
    types: [upstream-updated]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.CASCADE_PAT }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'

      - name: Update dependencies
        run: pnpm update scratch-vm scratch-blocks scratch-render scratch-paint

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet pnpm-lock.yaml package.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add pnpm-lock.yaml package.json
          git commit -m "chore: update ${{ github.event.client_payload.source }}"
          git pull --rebase origin develop
          git push origin develop